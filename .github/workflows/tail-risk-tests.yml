name: Tail-risk unit tests

on:
  push:
    paths:
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tail-risk-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy scipy
      - name: Run synthetic tail-risk tests
        run: python -m unittest discover -s tests -v
